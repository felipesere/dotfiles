format = """
$directory${custom.story}$kubernetes${custom.jj}
$jobs$character\
"""
right_format = """
$time
"""

add_newline = true

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"

[directory]
style = "blue"

[git_branch]
disabled = true
style = "bold yellow"

[git_status]
disabled = true
format = "[($staged)](yellow)[($untracked)](blue)[($deleted)](red)[($modified)](green) "
conflicted = "✘"
untracked = "◍"
modified = "◍"
staged = "◍"
deleted = "◍"

[jobs]
symbol = "▧ "
style = "blue"
format = "[$number$symbol]($style) "

[kubernetes]
disabled = false
symbol = "☸ "
format = '($symbol)cluster:[$context]($style) @ ns:$namespace '
contexts = [
  { context_pattern = ".*prod.*", context_alias = "prod", style = "bold red" },
  { context_pattern = ".*sandbox.*", context_alias = "sbx", style = "bold yellow" },
  { context_pattern = ".*dev.*", context_alias = "dev", style = "green" },
  { context_pattern = ".*" },
]

[custom.story]
command = "story current"
when = "story current"
detect_files = [".story"]
ignore_timeout = true

[custom.jj]
when = "jj-starship detect"
shell = ["jj-starship", "--jj-symbol", ""]
format = "$output "
