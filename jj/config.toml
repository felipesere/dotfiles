[user]
name = "Felipe Sere"
email = "github@felipesere.com"

[ui]
editor = "nvim"
default-command = ["log", "--limit", "10"]
diff-editor = ":builtin"

[[--scope]]
--when.commands = ["diff", "show"]
[--scope.ui]
# pager = "delta"
# diff-formatter = ":git"
diff-formatter = ["difft", "--color=always", "--width=$width", "$left", "$right"]

[colors]
# Workspace names (e.g. `felipe@`) in `jj log`; default is green, which blends in with `(empty)` and the `@` node
working_copies = "red"
"working_copy working_copies" = "bright red"

[merge-tools.diffconflicts]
program = "nvim"
merge-args = [
    "-c", "let g:jj_diffconflicts_marker_length=$marker_length",
    "-c", "JJDiffConflicts!", "$output", "$base", "$left", "$right",
]
merge-tool-edits-conflict-markers = true

[template-aliases]
'format_timestamp(timestamp)' = 'timestamp.ago()'

[templates]
draft_commit_description = 'builtin_draft_commit_description_with_diff'
git_push_bookmark = '"felipesere/push-" ++ change_id.short()'

[git]
sign-on-push = true

[revsets]
immutable-heads = 'builtin_immutable_heads() ~ tags(glob:"*-pre*")'

[revset-aliases]
bot_author = '(author(tl-renovate) | author(dependabot))'
trunk = 'trunk()'
merged = '::trunk()'
near_bookmark = 'heads(::@ & bookmarks())'
proper_tags = 'tags(regex:"v\\d+.\\d+.\\d+$")'
'around(r, depth)' =  'ancestors(r, depth) | descendants(r, depth)'
'around(r)' =  'ancestors(r, 5) | descendants(r, 5)'
'around_fork(left, right)' = 'around(fork_point(left | right), 5) | left | right'
eops = 'author_name(substring-i:"felipe") | author_name(substring-i:"eirik") | author_name(substring-i:"weichung")'
'branch(x)' = 'fork_point(main | x)..x'

[aliases]
l = ["log", "-n", "20"]
ll = ["log", "-n", "20", "-r", "::trunk() | ::@"]
lll = ["log", "-r", "::trunk() | ::@"]
tug = ["bookmark", "advance"]
tug- = ["bookmark", "advance", "--to", "@-"]
conflicts = ["log", "-r", "@", "-T", "conflicted_files.map(|f| f.path()).join(\"\\n\")", "--no-graph"]
changed-files = ["log", "-r", "@", "-T", "self.diff().files().map(|f| f.path()).join(\"\\n\")", "--no-graph"]

view-pr = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
#!/usr/bin/env bash

nearest_bookmark() {
  jj log --no-graph -r 'near_bookmark' -T 'local_bookmarks.join("\n")' | fzf --select-1
}

BOOKMARK="${1:-$(nearest_bookmark)}"

gh pr view $BOOKMARK -w
""",
  "",
]

create-pr = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
  #!/usr/bin/env bash
  set -euo pipefail

  # gh shells out to git to find the remote. In a non-colocated jj repo there is
  # no .git folder, so point git at the repository jj keeps under .jj/
  if [[ ! -e "$(jj root)/.git" ]]; then
    export GIT_DIR="$(jj git root)"
  fi

  stack=false
  rev=""
  while [[ $# -gt 0 ]]; do
    case "$1" in
      --stack) stack=true ;;
      *) rev="$1" ;;
    esac
    shift
  done
  rev="${rev:-@}"

  # The revision must carry a local bookmark; that becomes the PR head
  head=$(jj log --no-graph --color=never -r "$rev" \
    -T 'if(local_bookmarks, local_bookmarks.first().name())')
  if [[ -z "$head" ]]; then
    echo "create-pr: revision '$rev' has no bookmark; run 'jj bookmark create <name> -r $rev' first" >&2
    exit 1
  fi

  # The bookmark must be pushed and in sync, i.e. <head>@origin points at the same commit
  if ! jj log --no-graph --color=never -r "$rev" \
      -T 'remote_bookmarks.filter(|b| b.remote() == "origin").map(|b| b.name()).join("\n") ++ "\n"' \
      | grep -qxF "$head"; then
    echo "create-pr: bookmark '$head' is not up-to-date on origin; run 'jj git push -b $head' first" >&2
    exit 1
  fi

  base=""
  if [[ "$stack" == true ]]; then
    # Nearest bookmark that is a strict ancestor of the revision we are pushing
    base=$(jj log --no-graph --color=never \
      -r "heads((::$rev & bookmarks()) ~ $rev)" \
      -T 'local_bookmarks.map(|b| b.name()) ++ "\n"' | awk 'NF{print $1; exit}')
    if [[ -z "$base" ]]; then
      echo "create-pr: no ancestor bookmark found, falling back to trunk" >&2
    fi
  fi

  if [[ -n "$base" ]]; then
    base_rev="$base"
  else
    base="$(jj repo-trunk | awk '{print $1}')"
    base_rev="trunk()"
  fi

  # Get descriptions of changes between the base and the revision
  descriptions=$(jj log --no-graph -r "$base_rev..$rev" -T 'if(description,
  description.first_line() ++ "\n")')

  # Count non-empty lines
  count=$(echo "$descriptions" | grep -c '.' || true)

  if [[ "$count" -eq 0 ]]; then
    # No existing descriptions, go straight to custom input
    desc=$(gum input --placeholder "Enter a description...")
  elif [[ "$count" -eq 1 ]]; then
    # Only one description, use it directly
    desc=$(echo "$descriptions" | grep '.')
  else
    # Multiple descriptions, let the user pick or write their own
    desc=$(printf '%s\n%s' "$descriptions" "[custom]" \
      | grep '.' \
      | gum filter --placeholder "Pick a description...")
  fi

  # If they picked [custom] or we need input
  if [[ "$desc" == "[custom]" || -z "$desc" ]]; then
    desc=$(gum input --placeholder "Enter a description...")
  fi

  gh pr create --head "$head" --base "$base" --draft --title "$desc" --body ""
""",
  "",
]

stack = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
  #!/usr/bin/env bash
  #
  #
  jj log -r 'bookmarks() & fork_point(main)..' --no-graph -T 'local_bookmarks.join("\n") ++ "\n"' | gum filter --no-limit | tac | xargs gh stack link
  """, ""
]

web = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
  #!/usr/bin/env bash
  open $(jj log -r @ -T 'git_web_url()' --no-graph)
""", ""]



repo-trunk = [
  "log",
  "--revisions",
  "trunk()",
  "--no-graph",
  "--color=never",
  "-T",
  # Plain bookmark names only: `bookmarks` would decorate them with `*` or `@origin`
  'coalesce(remote_bookmarks.filter(|b| b.remote() == "origin").map(|b| b.name()).join(" "), local_bookmarks.map(|b| b.name()).join(" "))',
]

prs = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
  #!/usr/bin/env bash
   PR_BOOKMARK=$(gh pr list --json number,title,headRefName \
         | fzj --format '#{number} {title}'\
         | jq -r '.headRefName')
  jj bookmark track "$PR_BOOKMARK" --remote=origin
  jj new $PR_BOOKMARK
""", ""]

ci = [
   "util",
   "exec",
   "--",
   "bash",
   "-c",
   """
   #!/usr/bin/env bash
   if jj root >/dev/null 2>&1; then
      repo=$(basename $(jj root))
      open "https://app.circleci.com/pipelines/github/TrueLayer/$repo"
   fi
""", ""]

